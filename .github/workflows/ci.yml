name: CI

on:
  push:
    branches: [main, milestone-1-secure-platform-foundation, milestone-2-voice-restoration-poc]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  audio-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/audio-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: PYTHONPATH=. pytest -q
